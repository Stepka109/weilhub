<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2F68FF" />
    <title>Offline · WeilHub</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f7f9fc; color: #14213d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 380px; padding: 24px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 24px; margin: 24px 0 8px; }
      p { color: #5f6878; line-height: 1.6; }
      button { margin-top: 20px; background: #2f68ff; color: #fff; border: 0; border-radius: 999px; padding: 12px 24px; font-size: 16px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="WeilHub" />
      <h1>Jste offline</h1>
      <p>WeilHub potřebuje připojení k internetu. Z bezpečnostních důvodů neukládáme materiály ani další soukromá data do zařízení.</p>
      <button onclick="location.reload()">Zkusit znovu</button>
    </main>
  </body>
</html>
